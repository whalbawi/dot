# Prefix key C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "screen-256color"

# Increase scroll history
set -g history-limit 99999

# Show only the pane number in each pane's title bar.
set -gw pane-border-status top
set -gw pane-border-format '#{pane_index}'

# Sane splitting
unbind %
bind | split-window -h
bind _ split-window -v

# Toggle a temporary centered view, preserving the original window layout.
source-file ~/.tmux-center.conf

# Vim-style navigation
setw -g mode-keys vi
bind p paste-buffer

# First clear the screen, then the buffer history
bind k send-keys C-l \; run 'sleep 0.1' \; clear-history

# Reload configuration
bind R source-file ~/.tmux.conf \; display-message "Configuration reloaded"

bind -r C-j resize-pane -L
bind -r C-k resize-pane -R

set -g base-index 1
bind-key -r < swap-window -d -t -1
bind-key -r > swap-window -d -t +1

set -g renumber-windows on

if-shell "[ $(uname) = 'Darwin' ]" 'source-file ~/.tmux-darwin.conf'
if-shell "[ $(uname) = 'Linux' ]" 'source-file ~/.tmux-linux.conf'

set -g mouse on

# Clipboard bindings are shared; the per-OS files only set copy-command
# (and set-clipboard), which the bare copy-pipe-and-cancel below falls back to.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Copy selection wrapped as a markdown code block
bind -T copy-mode-vi \\ send -X copy-pipe-and-cancel "
awk 'BEGIN{print \"```\"} {print} END{print \"```\"}' | $(tmux show -sv copy-command)
"\; display-message "Copied selection. Wrapped in markdown."

# Copy selection wrapped as a JIRA code block
bind -T copy-mode-vi ] send -X copy-pipe-and-cancel "
awk 'BEGIN{print \"{code:none}\"} {print} END{print \"{code}\"}' | $(tmux show -sv copy-command)
"\; display-message "Copied selection. JIRA ready."

# Copy the whole pane (scrollback included) wrapped as a JIRA code block
bind -T copy-mode-vi [ send -X history-top \; \
                       send -X begin-selection \; \
                       send -X history-bottom \; \
                       send -X copy-pipe-and-cancel "
awk 'BEGIN{print \"{code:none}\"} {print} END{print \"{code}\"}' | $(tmux show -sv copy-command)
" \; \
                       display-message "Copied pane. JIRA ready."

# Copy the whole pane (scrollback included) as plain text
bind -T copy-mode-vi A send -X history-top \; \
                       send -X begin-selection \; \
                       send -X history-bottom \; \
                       send -X copy-pipe-and-cancel \; \
                       display-message "Copied pane"

bind-key -n TripleClick1Pane \
    copy-mode -M \; \
    send -X select-line \; \
    run "sleep 0.1" \; \
    send -X copy-pipe-and-cancel

bind-key -n DoubleClick1Pane \
    copy-mode -M \; \
    send -X select-word \; \
    run "sleep 0.1" \; \
    send -X copy-pipe-and-cancel

set -g status-left-length 200
set -g status-right-length 200

set -g status-right "#(printf \"[UTC] %%s | [PST] %%s\" \
                      $(date -u +%%Y-%%m-%%dT%%H:%%M) \
                      $(TZ=PST8PDT date +%%Y-%%m-%%dT%%H:%%M)) | #H"
