# Prefix key C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Increase scroll history
set history-limit 99999

# Sane splitting
unbind %
bind | split-window -h
bind _ split-window -v

# Vim-style navigation
setw -g mode-keys vi
bind p paste-buffer

if-shell "[ $(uname) = 'Darwin' ]" 'source-file ~/.tmux-darwin.conf'
if-shell "[ $(uname) = 'Linux' ]" 'source-file ~/.tmux-linux.conf'
