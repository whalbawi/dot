# Center the active pane between two empty margins. Requires tmux 3.4+.
# Command blocks are global; view state is window-local and links are pane-local.

set-option -g @center-native-create {
    # Snapshot the source before split-window changes the command context.
    # Moving an empty split to a new window avoids starting a bootstrap process.
    run-shell -C 'split-window -fh -l 1 ""; set-option -p @center-original-pane "#{pane_id}"; set-option -p @center-origin-window "#{window_id}"; set-option -p @center-origin-layout "#{window_layout}"; set-option -p @center-origin-zoom "#{window_zoomed_flag}"; break-pane -n [#{window_index}/#{pane_index}]; run-shell -C "##{@center-native-build}"'
}

set-option -g @center-native-build {
    # The empty pane carries the source information across break-pane.
    set-option -wF @center-original-pane '#{@center-original-pane}'
    set-option -wF @center-origin-window '#{@center-origin-window}'
    set-option -wF @center-origin-layout '#{@center-origin-layout}'
    set-option -wF @center-origin-zoom '#{@center-origin-zoom}'
    set-option -wF @center-placeholder-pane '#{pane_id}'
    set-option -w automatic-rename off
    set-option -w allow-rename off
    set-option -pu @center-original-pane
    set-option -pu @center-origin-window
    set-option -pu @center-origin-layout
    set-option -pu @center-origin-zoom

    # The placeholder carries its view link into the source during swap-pane.
    # Each source pane can therefore have an independent centered view.
    set-option -pF @center-pane-view '#{window_id}'
    run-shell -C 'select-layout -t "#{@center-origin-window}" "#{@center-origin-layout}"'
    if-shell -F '#{@center-origin-zoom}' {
        run-shell -C 'resize-pane -Z -t "#{@center-original-pane}"'
    }

    # The separators consume two columns; divide the remaining width 1:2:1.
    set-option -wF @center-margin '#{e|/:#{e|-:#{window_width},2},4}'
    split-window -hb -l '#{@center-margin}' ''
    set-option -wF @center-left-pane '#{pane_id}'
    run-shell -C 'select-pane -t "#{@center-placeholder-pane}"'
    split-window -h -l '#{@center-margin}' ''
    set-option -wF @center-right-pane '#{pane_id}'
    run-shell -C 'swap-pane -dZ -s "#{@center-original-pane}" -t "#{@center-placeholder-pane}"; select-pane -t "#{@center-original-pane}"'
}

set-option -g @center-native-restore {
    # Double hashes delay a format until the nested if-shell evaluates its target.
    # Missing/moved panes produce a message, never deletion of the working pane.
    run-shell -C 'if-shell -F -t "#{@center-original-pane}" "##{==:##{window_id},#{window_id}}" { run-shell -C "##{@center-native-check-return}" } { display-message "Centered view: the working pane has moved or closed; leaving this window intact." }'
}

set-option -g @center-native-check-return {
    run-shell -C 'if-shell -F -t "#{@center-placeholder-pane}" "##{&&:##{==:##{window_id},#{@center-origin-window}},##{==:##{pane_pid},0}}" { run-shell -C "##{@center-native-return}" } { display-message "Centered view: the original position is gone or in use; keeping your pane here." }'
}

set-option -g @center-native-return {
    # Expand all IDs before swapping, selecting the source, or clearing options.
    # Only our original, still-empty margins/placeholder may be removed. Panes
    # the user added, moved, or respawned with a program are preserved.
    run-shell -C 'swap-pane -dZ -s "#{@center-original-pane}" -t "#{@center-placeholder-pane}"; \
        select-pane -Z -t "#{@center-original-pane}"; \
        select-window -t "#{@center-origin-window}"; \
        set-option -pu -t "#{@center-placeholder-pane}" @center-pane-view; \
        set-option -wu -t "#{@center-origin-window}" @center-view; \
        set-option -wu -t "#{window_id}" @center-original-pane; \
        set-option -wu -t "#{window_id}" @center-placeholder-pane; \
        set-option -wu -t "#{window_id}" @center-origin-window; \
        set-option -wu -t "#{window_id}" @center-origin-layout; \
        set-option -wu -t "#{window_id}" @center-origin-zoom; \
        set-option -wu -t "#{window_id}" @center-margin; \
        set-option -wu -t "#{window_id}" @center-left-pane; \
        set-option -wu -t "#{window_id}" @center-right-pane; \
        if-shell -F -t "#{@center-left-pane}" "##{&&:##{==:##{window_id},#{window_id}},##{==:##{pane_pid},0}}" { kill-pane -t "#{@center-left-pane}" }; \
        if-shell -F -t "#{@center-right-pane}" "##{&&:##{==:##{window_id},#{window_id}},##{==:##{pane_pid},0}}" { kill-pane -t "#{@center-right-pane}" }; \
        if-shell -F -t "#{@center-placeholder-pane}" "##{&&:##{==:##{window_id},#{window_id}},##{==:##{pane_pid},0}}" { kill-pane -t "#{@center-placeholder-pane}" }'
}

set-option -g @center-native-pull {
    # Selecting the linked view gives the return commands its window context.
    run-shell -C 'if-shell -F -t "#{@center-pane-view}" "##{@center-original-pane}" { run-shell -C "##{@center-native-pull-return}" } { display-message "Centered view: the expanded pane is no longer available." }'
}

set-option -g @center-native-pull-return {
    run-shell -C 'select-window -t "#{@center-pane-view}"'
    run-shell -C '#{@center-native-restore}'
}

set-option -g @center-native-start {
    if-shell -F '#{>=:#{window_width},12}' {
        run-shell -C '#{@center-native-create}'
    } {
        display-message 'Centered view: the window is too narrow for three columns.'
    }
}

set-option -g @center-native-toggle {
    wait-for -L center-pane-toggle
    if-shell -F '#{@center-original-pane}' {
        run-shell -C '#{@center-native-restore}'
    } {
        if-shell -F '#{@center-pane-view}' {
            run-shell -C '#{@center-native-pull}'
        } {
            run-shell -C '#{@center-native-start}'
        }
    }
    wait-for -U center-pane-toggle
}

bind-key Z run-shell -C '#{@center-native-toggle}'

