# Use mouse
set -g mouse on

bind -T copy-mode-vi ] send -X copy-pipe-and-cancel "cat <<EOF | pbcopy
{code:none}
$(cat -)
{code}
EOF
" \; \
                       display-message "Copied selection. JIRA ready."

bind -T copy-mode-vi [ send -X history-top \; \
                       send -X begin-selection \; \
                       send -X history-bottom \; \
                       send -X copy-pipe-and-cancel "cat <<EOF | pbcopy
{code:none}
$(cat -)
{code}
EOF
" \; \
                       display-message "Copied pane. JIRA ready."

bind -T copy-mode-vi A send -X history-top \; \
                       send -X begin-selection \; \
                       send -X history-bottom \; \
                       send -X copy-pipe-and-cancel "pbcopy" \; \
                       display-message "Copied pane"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

bind-key -n TripleClick1Pane \
    copy-mode -M \; \
    send -X select-line \; \
    run "sleep 0.1" \; \
    send -X copy-pipe-and-cancel "pbcopy"

bind-key -n DoubleClick1Pane \
    copy-mode -M \; \
    send -X select-word \; \
    run "sleep 0.1" \; \
    send -X copy-pipe-and-cancel "pbcopy"
